<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Warm indoor ambient background resembling the artisan workshop -->
    <radialGradient id="ubtanCropBg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#3C322B"/>
      <stop offset="60%" stop-color="#261F1A"/>
      <stop offset="100%" stop-color="#14100D"/>
    </radialGradient>

    <!-- Golden Amber Ayurvedic Herbal Soap Body Gradient -->
    <linearGradient id="cropHerbalSoap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B8763A"/>
      <stop offset="30%" stop-color="#A26027"/>
      <stop offset="65%" stop-color="#894A1A"/>
      <stop offset="100%" stop-color="#67320D"/>
    </linearGradient>

    <!-- Natural surface moisture sheen -->
    <radialGradient id="cropSoapSheen" cx="45%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#D9975B"/>
      <stop offset="45%" stop-color="#A8652D"/>
      <stop offset="85%" stop-color="#7B4115"/>
      <stop offset="100%" stop-color="#55290A"/>
    </radialGradient>

    <!-- Hand skin tone gradient -->
    <linearGradient id="handSkin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8B896"/>
      <stop offset="50%" stop-color="#D49E78"/>
      <stop offset="100%" stop-color="#B57F5A"/>
    </linearGradient>

    <filter id="ubtanCropShadow" x="-25%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Ambient Backdrop -->
  <rect width="600" height="600" fill="url(#ubtanCropBg)"/>

  <!-- Subtle warm ambient lighting glow -->
  <ellipse cx="300" cy="280" rx="200" ry="240" fill="#69462A" opacity="0.25" filter="blur(40px)"/>

  <!-- Artisan Hand Holding the Bar (as in user's photo) -->
  <g id="artisan-hand" opacity="0.95">
    <!-- Left thumb & palm holding edge -->
    <path d="M 90 280 C 100 240, 140 230, 160 250 C 175 265, 175 320, 150 360 C 130 390, 80 410, 60 480 C 50 510, 40 560, 40 600 L 140 600 C 150 540, 165 480, 180 430 Z" fill="url(#handSkin)" filter="url(#ubtanCropShadow)"/>
    <!-- Left thumb tip pressing on soap side -->
    <ellipse cx="160" cy="270" rx="22" ry="34" fill="#E4AE8A" transform="rotate(15 160 270)"/>
    <ellipse cx="152" cy="255" rx="7" ry="10" fill="#D67B70" opacity="0.6" transform="rotate(15 152 255)"/> <!-- nail polish touch -->

    <!-- Right fingers resting behind and on the edge -->
    <path d="M 430 220 C 455 220, 475 235, 475 260 C 475 285, 455 300, 435 300 Z" fill="url(#handSkin)"/>
    <path d="M 435 310 C 460 310, 475 325, 475 350 C 475 375, 455 390, 435 390 Z" fill="url(#handSkin)"/>
    <path d="M 430 400 C 455 400, 470 415, 470 440 C 470 465, 450 480, 430 480 Z" fill="url(#handSkin)"/>
  </g>

  <!-- The Authentic Handcrafted Bridal Ubtan Soap Bar Block -->
  <g transform="translate(300, 300)" filter="url(#ubtanCropShadow)">
    <!-- 3D Depth Block -->
    <rect x="-135" y="-195" width="270" height="400" rx="16" fill="#3D1D06"/>
    
    <!-- Soap Face with Handcrafted Chamfered Edges -->
    <rect x="-140" y="-200" width="270" height="400" rx="14" fill="url(#cropSoapSheen)" stroke="#C88849" stroke-width="2"/>

    <!-- Subtle Natural Moisture Highlight along the left/top edge -->
    <path d="M -126 -185 L 115 -185" stroke="#F5BA7D" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
    <path d="M -128 -180 L -128 175" stroke="#F5BA7D" stroke-width="2" stroke-linecap="round" opacity="0.5"/>

    <!-- Densely Speckled 18-Ayurvedic Herbal Texture (Haldi, Chandan, Kesar, Besan, Mulethi) -->
    <!-- Dark herbal speckles (real dried botanical extracts) -->
    <g fill="#241103" opacity="0.9">
      <circle cx="-100" cy="-160" r="3.2"/>
      <circle cx="-50" cy="-175" r="2.5"/>
      <circle cx="20" cy="-165" r="3.8"/>
      <circle cx="80" cy="-150" r="2.8"/>
      <circle cx="-115" cy="-110" r="3.5"/>
      <circle cx="-65" cy="-125" r="4"/>
      <circle cx="-15" cy="-95" r="3.2"/>
      <circle cx="50" cy="-115" r="2.4"/>
      <circle cx="100" cy="-90" r="3.6"/>
      <circle cx="-85" cy="-45" r="2.8"/>
      <circle cx="-25" cy="-55" r="3.8"/>
      <circle cx="30" cy="-30" r="3.2"/>
      <circle cx="85" cy="-40" r="2.5"/>
      <circle cx="-105" cy="15" r="3.5"/>
      <circle cx="-45" cy="35" r="2.8"/>
      <circle cx="15" cy="25" r="4.2"/>
      <circle cx="75" cy="10" r="3"/>
      <circle cx="110" cy="40" r="2.6"/>
      <circle cx="-80" cy="95" r="3.8"/>
      <circle cx="-20" cy="85" r="2.8"/>
      <circle cx="45" cy="105" r="3.5"/>
      <circle cx="95" cy="90" r="3"/>
      <circle cx="-95" cy="150" r="3.2"/>
      <circle cx="-35" cy="160" r="3.8"/>
      <circle cx="25" cy="140" r="2.8"/>
      <circle cx="80" cy="165" r="3.4"/>
      <!-- Scattered fine grains -->
      <circle cx="-110" cy="-70" r="1.8"/>
      <circle cx="-75" cy="0" r="2"/>
      <circle cx="0" cy="-130" r="2.2"/>
      <circle cx="65" cy="-70" r="1.9"/>
      <circle cx="-50" cy="120" r="2.2"/>
      <circle cx="60" cy="60" r="2"/>
      <circle cx="0" cy="170" r="2.2"/>
    </g>

    <!-- Golden Turmeric (Haldi) & Saffron (Kesar) Glowing Granules -->
    <g fill="#FEE085" opacity="0.95">
      <circle cx="-75" cy="-145" r="2"/>
      <circle cx="-15" cy="-155" r="2.2"/>
      <circle cx="60" cy="-135" r="2"/>
      <circle cx="-95" cy="-85" r="2.4"/>
      <circle cx="-40" cy="-75" r="2"/>
      <circle cx="15" cy="-80" r="2.5"/>
      <circle cx="75" cy="-60" r="1.8"/>
      <circle cx="-65" cy="-20" r="2.2"/>
      <circle cx="0" cy="-10" r="2.4"/>
      <circle cx="55" cy="-10" r="1.8"/>
      <circle cx="95" cy="10" r="2"/>
      <circle cx="-85" cy="55" r="2.2"/>
      <circle cx="-30" cy="60" r="2.5"/>
      <circle cx="35" cy="70" r="2"/>
      <circle cx="85" cy="75" r="1.8"/>
      <circle cx="-70" cy="125" r="2"/>
      <circle cx="-10" cy="130" r="2.2"/>
      <circle cx="50" cy="145" r="2.4"/>
      <circle cx="95" cy="135" r="1.8"/>
    </g>

    <!-- Sandalwood (Chandan) micro-powder dust -->
    <g fill="#ECD0A5" opacity="0.75">
      <circle cx="-30" cy="-110" r="1.2"/>
      <circle cx="35" cy="-100" r="1.2"/>
      <circle cx="-60" cy="40" r="1.2"/>
      <circle cx="10" cy="50" r="1.2"/>
      <circle cx="-40" cy="150" r="1.2"/>
      <circle cx="40" cy="160" r="1.2"/>
    </g>
  </g>

  <!-- Corner watermark badge -->
  <g transform="translate(60, 60)">
    <circle cx="0" cy="0" r="28" fill="#EFE6D5" stroke="#263E2E" stroke-width="1.5" opacity="0.92"/>
    <text x="0" y="-3" font-family="'Cormorant Garamond', Georgia, serif" font-size="12" font-weight="700" fill="#263E2E" text-anchor="middle">OB</text>
    <text x="0" y="9" font-family="'Cormorant Garamond', Georgia, serif" font-size="6" font-weight="700" fill="#263E2E" text-anchor="middle" letter-spacing="0.5">ORGANIC BLOOM</text>
  </g>
</svg>
