<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Background studio lighting gradient -->
    <radialGradient id="studioGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFF9F0"/>
      <stop offset="60%" stop-color="#EFE6D8"/>
      <stop offset="100%" stop-color="#DDD0BF"/>
    </radialGradient>

    <!-- Wood table texture -->
    <linearGradient id="woodTable" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6F4E37"/>
      <stop offset="25%" stop-color="#5C3D28"/>
      <stop offset="70%" stop-color="#4A2E1B"/>
      <stop offset="100%" stop-color="#382111"/>
    </linearGradient>

    <!-- Stainless steel boiler pot -->
    <linearGradient id="steelPot" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9E9E9E"/>
      <stop offset="20%" stop-color="#E0E0E0"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="80%" stop-color="#BDBDBD"/>
      <stop offset="100%" stop-color="#757575"/>
    </linearGradient>

    <!-- Molten translucent soap base with herbal golden glow -->
    <linearGradient id="moltenBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF4D0" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#FCD34D" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#F59E0B" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#D97706" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Vegetable glycerin & coconut base cubes -->
    <linearGradient id="baseCube" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#F3F4F6" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#E5E7EB" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Wooden stirring paddle -->
    <linearGradient id="woodPaddle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B45309"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>

    <!-- Clay bowl gradient -->
    <linearGradient id="terracottaBowl" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="50%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#263E2E" flood-opacity="0.18"/>
    </filter>

    <filter id="potShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Studio Ambient Background -->
  <rect width="800" height="600" fill="url(#studioGlow)"/>

  <!-- Workshop window light reflection on atelier wall -->
  <path d="M 0 0 L 320 0 L 220 340 L 0 340 Z" fill="#FFFFFF" opacity="0.18"/>
  <path d="M 480 0 L 800 0 L 800 340 L 580 340 Z" fill="#FFFFFF" opacity="0.12"/>

  <!-- Atelier Rustic Wooden Workbench -->
  <rect x="0" y="340" width="800" height="260" fill="url(#woodTable)"/>
  <!-- Table edge highlight -->
  <line x1="0" y1="340" x2="800" y2="340" stroke="#8C6246" stroke-width="3"/>
  <line x1="0" y1="343" x2="800" y2="343" stroke="#3A2312" stroke-width="2"/>

  <!-- Studio Header Plaque -->
  <g transform="translate(40, 36)">
    <rect x="0" y="0" width="310" height="52" rx="10" fill="#263E2E" opacity="0.92"/>
    <circle cx="28" cy="26" r="14" fill="#E3B873"/>
    <text x="28" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold" fill="#1C2C20" text-anchor="middle">OB</text>
    <text x="52" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="bold" fill="#FAF7F2">AHMEDABAD ARTISAN ATELIER</text>
    <text x="52" y="40" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#C5DBC7">Melt &amp; Pour Botanical Base Infusion</text>
  </g>

  <!-- Ceramic tile heatplate / induction base -->
  <ellipse cx="400" cy="460" rx="210" ry="60" fill="#1C2C20" opacity="0.35" filter="url(#softShadow)"/>
  <ellipse cx="400" cy="455" rx="190" ry="50" fill="#2A2A2A"/>
  <ellipse cx="400" cy="453" rx="180" ry="46" fill="#3A3A3A"/>
  <ellipse cx="400" cy="452" rx="150" ry="38" fill="#4B5563"/>

  <!-- Stainless Steel Melting Bowl / Double Boiler -->
  <g filter="url(#potShadow)">
    <!-- Base / lower bowl -->
    <path d="M 230 330 C 230 450 570 450 570 330 Z" fill="url(#steelPot)"/>
    <!-- Outer rim of boiler -->
    <ellipse cx="400" cy="330" rx="170" ry="36" fill="#D1D5DB" stroke="#9CA3AF" stroke-width="3"/>
    <!-- Inner bowl recess -->
    <ellipse cx="400" cy="330" rx="160" ry="32" fill="#4B5563"/>

    <!-- Molten Plant Soap Base Liquid inside the bowl -->
    <ellipse cx="400" cy="336" rx="156" ry="30" fill="url(#moltenBase)"/>

    <!-- Swirling botanical herbal ripples -->
    <path d="M 310 334 Q 400 350 490 334 Q 440 324 350 330 Z" fill="#F59E0B" opacity="0.6"/>
    <path d="M 330 340 Q 410 354 470 338 Q 430 330 370 334 Z" fill="#D97706" opacity="0.7"/>

    <!-- Floating melting cubes of pure vegetable glycerin base -->
    <g transform="translate(290, 320)">
      <rect x="0" y="0" width="34" height="26" rx="4" fill="url(#baseCube)" stroke="#FFFFFF" stroke-width="1.5" opacity="0.9"/>
      <line x1="4" y1="6" x2="30" y2="6" stroke="#FFFFFF" stroke-width="2"/>
    </g>
    <g transform="translate(335, 332)">
      <rect x="0" y="0" width="28" height="22" rx="3" fill="url(#baseCube)" stroke="#FFFFFF" stroke-width="1.5" opacity="0.85"/>
    </g>
    <g transform="translate(440, 324)">
      <rect x="0" y="0" width="32" height="24" rx="4" fill="url(#baseCube)" stroke="#FFFFFF" stroke-width="1.5" opacity="0.88"/>
    </g>
    <g transform="translate(470, 334)">
      <rect x="0" y="0" width="26" height="20" rx="3" fill="url(#baseCube)" stroke="#FFFFFF" stroke-width="1.5" opacity="0.8"/>
    </g>

    <!-- Ayurvedic Herb Powder being stirred in: Golden Haldi, Kesar & Rice Milk ribbons -->
    <path d="M 360 326 C 390 345 420 342 450 330" stroke="#B45309" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.85"/>
    <path d="M 370 332 C 395 348 415 346 440 334" stroke="#FDE68A" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.9"/>
    <!-- Activated Charcoal swirl ribbon -->
    <path d="M 340 336 C 370 348 400 346 425 338" stroke="#1F2937" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.5"/>

    <!-- Stainless steel side handles with copper brass rivets -->
    <path d="M 228 340 C 200 340 195 365 220 375 C 228 365 230 350 230 340 Z" fill="#9E9E9E" stroke="#757575" stroke-width="1.5"/>
    <circle cx="222" cy="355" r="3" fill="#D97706"/>
    <path d="M 572 340 C 600 340 605 365 580 375 C 572 365 570 350 570 340 Z" fill="#9E9E9E" stroke="#757575" stroke-width="1.5"/>
    <circle cx="578" cy="355" r="3" fill="#D97706"/>
  </g>

  <!-- Artisan Wooden Mixing Spatula dipped into molten base -->
  <g transform="translate(435, 140) rotate(22)" filter="url(#softShadow)">
    <!-- Wooden handle -->
    <rect x="-8" y="0" width="16" height="190" rx="5" fill="url(#woodPaddle)"/>
    <rect x="-6" y="8" width="12" height="170" rx="3" fill="#F59E0B" opacity="0.25"/>
    <!-- Wide spatula head -->
    <path d="M -16 185 L 16 185 C 22 220 18 240 0 250 C -18 240 -22 220 -16 185 Z" fill="url(#woodPaddle)"/>
    <!-- Golden molten soap coating on the spatula tip -->
    <path d="M -15 210 L 15 210 C 18 230 14 245 0 250 C -14 245 -18 230 -15 210 Z" fill="#FBBF24" opacity="0.95"/>
    <!-- Liquid soap droplet dripping from spatula -->
    <path d="M 0 250 C 4 258 5 264 0 270 C -5 264 -4 258 0 250 Z" fill="#F59E0B"/>
  </g>

  <!-- Left Side: Terracotta Bowl with Raw Plant Soap Base Cubes -->
  <g transform="translate(60, 380)" filter="url(#softShadow)">
    <ellipse cx="70" cy="80" rx="65" ry="25" fill="#1C2C20" opacity="0.25"/>
    <path d="M 10 75 C 10 130 130 130 130 75 Z" fill="url(#terracottaBowl)"/>
    <ellipse cx="70" cy="75" rx="60" ry="18" fill="#92400E"/>
    <ellipse cx="70" cy="74" rx="56" ry="16" fill="#B45309"/>

    <!-- Stash of white & transparent glycerin cubes ready to melt -->
    <rect x="30" y="48" width="28" height="22" rx="3" fill="url(#baseCube)" stroke="#FFFFFF" stroke-width="1.2"/>
    <rect x="54" y="44" width="30" height="24" rx="3" fill="url(#baseCube)" stroke="#FFFFFF" stroke-width="1.2"/>
    <rect x="78" y="50" width="26" height="22" rx="3" fill="url(#baseCube)" stroke="#FFFFFF" stroke-width="1.2"/>
    <rect x="42" y="32" width="26" height="20" rx="3" fill="url(#baseCube)" stroke="#FFFFFF" stroke-width="1.2"/>
    <rect x="64" y="30" width="28" height="22" rx="3" fill="url(#baseCube)" stroke="#FFFFFF" stroke-width="1.2"/>

    <text x="70" y="145" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#FAF7F2" text-anchor="middle">Pure Plant Glycerin Base</text>
  </g>

  <!-- Right Side: Ayurvedic Herbs Bowl (Turmeric, Sandalwood & Kashmiri Saffron) -->
  <g transform="translate(610, 385)" filter="url(#softShadow)">
    <ellipse cx="65" cy="75" rx="60" ry="22" fill="#1C2C20" opacity="0.25"/>
    <path d="M 10 70 C 10 125 120 125 120 70 Z" fill="#263E2E"/>
    <ellipse cx="65" cy="70" rx="55" ry="16" fill="#1C2C20"/>
    <!-- Golden Kasturi Haldi & Chandan powder mound -->
    <path d="M 22 68 Q 65 38 108 68 Z" fill="#D97706"/>
    <path d="M 35 66 Q 65 44 95 66 Z" fill="#F59E0B"/>
    <!-- Kashmiri Kesar (Saffron) strands on top -->
    <line x1="55" y1="52" x2="68" y2="46" stroke="#DC2626" stroke-width="2" stroke-linecap="round"/>
    <line x1="62" y1="56" x2="74" y2="52" stroke="#DC2626" stroke-width="2" stroke-linecap="round"/>
    <line x1="50" y1="58" x2="60" y2="62" stroke="#DC2626" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Small amber essential oil bottle -->
    <g transform="translate(100, 30)">
      <rect x="0" y="20" width="22" height="42" rx="4" fill="#78350F" stroke="#B45309" stroke-width="1"/>
      <rect x="6" y="14" width="10" height="8" fill="#1C2C20"/>
      <rect x="4" y="8" width="14" height="7" rx="2" fill="#D1D5DB"/>
      <rect x="3" y="30" width="16" height="22" fill="#FAF7F2" opacity="0.85"/>
      <text x="11" y="44" font-family="'Plus Jakarta Sans', sans-serif" font-size="6" font-weight="bold" fill="#1C2C20" text-anchor="middle">OIL</text>
    </g>

    <text x="65" y="140" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#FAF7F2" text-anchor="middle">18 Raw Ayurvedic Herbs</text>
  </g>

  <!-- Steam & Warm Aroma Gentle Vapors -->
  <path d="M 360 270 Q 345 220 370 180 T 360 120" stroke="#FFFFFF" stroke-width="2.5" fill="none" opacity="0.35" stroke-linecap="round"/>
  <path d="M 405 260 Q 425 210 395 165 T 415 110" stroke="#FFFFFF" stroke-width="3" fill="none" opacity="0.4" stroke-linecap="round"/>
  <path d="M 450 265 Q 470 220 445 175 T 460 125" stroke="#FFFFFF" stroke-width="2.5" fill="none" opacity="0.35" stroke-linecap="round"/>

  <!-- Botanical Rose Petals scattered on table -->
  <path d="M 230 460 C 240 450 255 455 250 468 C 242 472 230 470 230 460 Z" fill="#BE123C" opacity="0.8"/>
  <path d="M 545 470 C 555 460 570 465 565 478 C 558 482 545 480 545 470 Z" fill="#BE123C" opacity="0.85"/>
  <path d="M 200 480 C 208 472 220 476 216 486 C 210 490 200 488 200 480 Z" fill="#9F1239" opacity="0.75"/>

  <!-- Badge at bottom right -->
  <g transform="translate(485, 542)">
    <rect x="0" y="0" width="280" height="34" rx="8" fill="#1C2C20" opacity="0.9" stroke="#E3B873" stroke-width="1"/>
    <text x="140" y="21" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#FAF7F2" text-anchor="middle">✨ Handcrafted in Ahmedabad • Zero Harsh Lye</text>
  </g>
</svg>
