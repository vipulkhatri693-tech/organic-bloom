<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Checkout — Organic Bloom')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>

<main class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
    <h1 class="font-display text-3xl sm:text-4xl font-bold text-[#1C2C20] mb-8">Checkout</h1>

    <form th:action="@{/checkout}" method="post" class="grid lg:grid-cols-3 gap-8">
        <!-- Shipping + payment -->
        <div class="lg:col-span-2 space-y-6">
            <section class="bg-[#FAF7F2] rounded-2xl border border-[#E6DDCF] p-6 shadow-xs">
                <h2 class="font-display text-xl font-semibold text-[#213527] mb-4">Delivery Details</h2>
                <div class="grid sm:grid-cols-2 gap-4">
                    <label class="block sm:col-span-2">
                        <span class="text-xs font-semibold text-[#5C554C]">Full Name</span>
                        <input name="fullName" required class="mt-1 w-full rounded-lg border border-[#DDD3C2] bg-white px-3 py-2.5 text-sm focus:outline-none focus:border-[#263E2E]"/>
                    </label>
                    <label class="block">
                        <span class="text-xs font-semibold text-[#5C554C]">Mobile Number</span>
                        <input name="phone" required pattern="[0-9+ ]{8,15}" placeholder="+91 ..." class="mt-1 w-full rounded-lg border border-[#DDD3C2] bg-white px-3 py-2.5 text-sm focus:outline-none focus:border-[#263E2E]"/>
                    </label>
                    <label class="block">
                        <span class="text-xs font-semibold text-[#5C554C]">Pincode</span>
                        <input name="pincode" required pattern="[0-9]{6}" placeholder="380001" class="mt-1 w-full rounded-lg border border-[#DDD3C2] bg-white px-3 py-2.5 text-sm focus:outline-none focus:border-[#263E2E]"/>
                    </label>
                    <label class="block sm:col-span-2">
                        <span class="text-xs font-semibold text-[#5C554C]">Address</span>
                        <textarea name="address" required rows="2" class="mt-1 w-full rounded-lg border border-[#DDD3C2] bg-white px-3 py-2.5 text-sm focus:outline-none focus:border-[#263E2E]"></textarea>
                    </label>
                    <label class="block sm:col-span-2">
                        <span class="text-xs font-semibold text-[#5C554C]">City / Town</span>
                        <input name="city" required class="mt-1 w-full rounded-lg border border-[#DDD3C2] bg-white px-3 py-2.5 text-sm focus:outline-none focus:border-[#263E2E]"/>
                    </label>
                </div>
            </section>

            <section class="bg-[#FAF7F2] rounded-2xl border border-[#E6DDCF] p-6 shadow-xs">
                <h2 class="font-display text-xl font-semibold text-[#213527] mb-4">Payment Method</h2>
                <div class="space-y-3">
                    <label class="flex items-center gap-3 rounded-xl border border-[#DDD3C2] px-4 py-3 cursor-pointer hover:border-[#263E2E] has-[:checked]:border-[#263E2E] has-[:checked]:bg-[#E8EFE8]">
                        <input type="radio" name="payment" value="COD" checked class="accent-[#263E2E]"/>
                        <span class="text-sm font-medium text-[#2C2926]">Cash on Delivery (COD)</span>
                    </label>
                    <label class="flex items-center gap-3 rounded-xl border border-[#DDD3C2] px-4 py-3 cursor-pointer hover:border-[#263E2E] has-[:checked]:border-[#263E2E] has-[:checked]:bg-[#E8EFE8]">
                        <input type="radio" name="payment" value="PhonePe / UPI" class="accent-[#263E2E]"/>
                        <span class="text-sm font-medium text-[#2C2926]">PhonePe / UPI QR</span>
                    </label>
                    <label class="flex items-center gap-3 rounded-xl border border-[#DDD3C2] px-4 py-3 cursor-pointer hover:border-[#263E2E] has-[:checked]:border-[#263E2E] has-[:checked]:bg-[#E8EFE8]">
                        <input type="radio" name="payment" value="Google Pay" class="accent-[#263E2E]"/>
                        <span class="text-sm font-medium text-[#2C2926]">Google Pay (GPay)</span>
                    </label>
                </div>
            </section>
        </div>

        <!-- Summary -->
        <aside class="bg-[#F5F0EA] rounded-2xl border border-[#E8DFD3] p-6 h-fit sticky top-28">
            <h2 class="font-display text-xl font-semibold text-[#213527] mb-4">Your Order</h2>
            <div class="space-y-3 max-h-64 overflow-y-auto pr-1">
                <div th:each="item : ${items}" class="flex gap-3 items-center">
                    <div class="w-12 h-12 rounded-lg bg-[#EFE9DF] overflow-hidden shrink-0">
                        <img th:src="${item.product.image}" th:alt="${item.product.name}" class="w-full h-full object-cover"/>
                    </div>
                    <div class="flex-1 min-w-0">
                        <p class="text-xs font-semibold text-[#1C2C20] line-clamp-1" th:text="${item.product.name}">Name</p>
                        <p class="text-[11px] text-[#7A7368]" th:text="'Qty ' + ${item.quantity}">Qty 1</p>
                    </div>
                    <span class="text-sm font-semibold text-[#1C2C20]" th:text="'₹' + ${item.lineTotal}">₹99</span>
                </div>
            </div>
            <div class="space-y-2.5 text-sm text-[#5C554C] mt-4 pt-4 border-t border-[#E0D6C7]">
                <div class="flex justify-between"><span>Subtotal</span><span class="font-semibold text-[#1C2C20]" th:text="'₹' + ${subtotal}">₹0</span></div>
                <div class="flex justify-between"><span>Shipping</span>
                    <span class="font-semibold" th:classappend="${shipping == 0} ? 'text-[#528C5F]' : 'text-[#1C2C20]'"
                          th:text="${shipping == 0} ? 'FREE' : '₹' + ${shipping}">FREE</span></div>
                <div class="flex justify-between pt-3 border-t border-[#E0D6C7] text-base">
                    <span class="font-semibold text-[#1C2C20]">Total</span>
                    <span class="font-display text-xl font-bold text-[#1C2C20]" th:text="'₹' + ${total}">₹0</span>
                </div>
            </div>
            <button type="submit" class="w-full mt-5 px-6 py-3.5 rounded-full bg-[#263E2E] text-white font-semibold text-sm hover:bg-[#1A2D20] transition-colors">
                Place Order
            </button>
            <a href="/cart" class="block text-center mt-3 text-xs text-[#5C554C] hover:text-[#263E2E] font-medium">Back to Bag</a>
        </aside>
    </form>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
