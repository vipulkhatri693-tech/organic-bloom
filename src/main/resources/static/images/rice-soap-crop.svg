<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Warm cream spa ambiance -->
    <radialGradient id="riceCropBg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#FCFAF5"/>
      <stop offset="60%" stop-color="#F3ECE0"/>
      <stop offset="100%" stop-color="#E5D9C7"/>
    </radialGradient>

    <!-- Warm wooden saucer gradient -->
    <radialGradient id="cropWoodSaucer" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D7AA77"/>
      <stop offset="60%" stop-color="#BC8A55"/>
      <stop offset="90%" stop-color="#9E6E3C"/>
      <stop offset="100%" stop-color="#7B5026"/>
    </radialGradient>

    <!-- Ivory Cold Process Rice Soap Gradient -->
    <linearGradient id="cropIvorySoap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#FAF7EE"/>
      <stop offset="75%" stop-color="#F2EAE0"/>
      <stop offset="100%" stop-color="#E6DDCF"/>
    </linearGradient>

    <filter id="riceCropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#423425" flood-opacity="0.32"/>
    </filter>
    <filter id="saucerCropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#554230" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="600" fill="url(#riceCropBg)"/>

  <!-- Delicate olive branches / jasmine leaves in background -->
  <g opacity="0.25" fill="#3D5A40">
    <ellipse cx="500" cy="80" rx="90" ry="160" transform="rotate(35 500 80)"/>
    <ellipse cx="100" cy="100" rx="80" ry="140" transform="rotate(-35 100 100)"/>
  </g>

  <!-- Natural Turned Wooden Plate / Saucer -->
  <ellipse cx="300" cy="350" rx="240" ry="140" fill="url(#cropWoodSaucer)" filter="url(#saucerCropShadow)"/>
  <ellipse cx="300" cy="350" rx="215" ry="120" fill="none" stroke="#7A5229" stroke-width="2" stroke-opacity="0.4"/>
  <ellipse cx="300" cy="350" rx="180" ry="98" fill="none" stroke="#8C6033" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Scattered Raw Rice Grains on Wooden Plate -->
  <g fill="#FFFDF8" stroke="#D1BEA8" stroke-width="0.8">
    <!-- Rice grains on wood -->
    <ellipse cx="160" cy="370" rx="11" ry="5" transform="rotate(25 160 370)"/>
    <ellipse cx="185" cy="390" rx="10" ry="4.5" transform="rotate(-40 185 390)"/>
    <ellipse cx="210" cy="410" rx="12" ry="5" transform="rotate(15 210 410)"/>
    <ellipse cx="400" cy="400" rx="11" ry="4.8" transform="rotate(50 400 400)"/>
    <ellipse cx="430" cy="375" rx="12" ry="5" transform="rotate(-20 430 375)"/>
    <ellipse cx="460" cy="340" rx="10" ry="4.5" transform="rotate(10 460 340)"/>
    <ellipse cx="250" cy="440" rx="11" ry="4.8" transform="rotate(-10 250 440)"/>
    <ellipse cx="350" cy="445" rx="12" ry="5" transform="rotate(35 350 445)"/>
    <ellipse cx="130" cy="340" rx="10" ry="4.5" transform="rotate(-55 130 340)"/>
  </g>

  <!-- Authentic Creamy Square Rice Soap Bar with Rounded Corners -->
  <g transform="translate(300, 300)" filter="url(#riceCropShadow)">
    <!-- 3D Shadow Base -->
    <rect x="-140" y="-120" width="280" height="240" rx="36" fill="#D4C8B8" transform="rotate(-6)"/>
    
    <!-- Main Soap Body -->
    <rect x="-145" y="-130" width="280" height="240" rx="34" fill="url(#cropIvorySoap)" stroke="#ECE4D8" stroke-width="2" transform="rotate(-6)"/>

    <!-- Subtle Bevel Highlight on Top Edge -->
    <path d="M -115 -115 Q 0 -130 115 -142" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.8"/>

    <!-- Real Organic Brown Rice Bran Bits & Flecks Embedded in Soap Surface -->
    <g fill="#7A4B29" opacity="0.85">
      <ellipse cx="-80" cy="-60" rx="7" ry="3.5" transform="rotate(35 -80 -60)"/>
      <ellipse cx="-20" cy="-80" rx="6" ry="3" transform="rotate(-20 -20 -80)"/>
      <ellipse cx="50" cy="-70" rx="8" ry="4" transform="rotate(45 50 -70)"/>
      <ellipse cx="90" cy="-40" rx="6" ry="3.2" transform="rotate(-30 90 -40)"/>
      <ellipse cx="-100" cy="10" rx="7.5" ry="3.8" transform="rotate(15 -100 10)"/>
      <ellipse cx="-40" cy="-10" rx="8" ry="4" transform="rotate(-50 -40 -10)"/>
      <ellipse cx="20" cy="10" rx="6.5" ry="3.5" transform="rotate(25 20 10)"/>
      <ellipse cx="70" cy="20" rx="7" ry="3.5" transform="rotate(-15 70 20)"/>
      <ellipse cx="-70" cy="60" rx="6" ry="3" transform="rotate(60 -70 60)"/>
      <ellipse cx="-10" cy="50" rx="8" ry="4" transform="rotate(-10 -10 50)"/>
      <ellipse cx="40" cy="70" rx="7" ry="3.8" transform="rotate(40 40 70)"/>
      <ellipse cx="80" cy="60" rx="6.5" ry="3" transform="rotate(-35 80 60)"/>
      
      <!-- Tiny micro-specks -->
      <circle cx="-50" cy="-30" r="1.8"/>
      <circle cx="0" cy="-40" r="2.2"/>
      <circle cx="30" cy="-20" r="1.5"/>
      <circle cx="-30" cy="30" r="2"/>
      <circle cx="60" cy="-10" r="1.8"/>
      <circle cx="-80" cy="35" r="2.2"/>
      <circle cx="10" cy="80" r="1.8"/>
    </g>
  </g>

  <!-- Delicate White Jasmine / Blossom in Corner -->
  <g transform="translate(480, 480)" fill="#FFFFFF" stroke="#D1BEA8" stroke-width="0.8">
    <circle cx="0" cy="-15" r="8"/>
    <circle cx="14" cy="-5" r="8"/>
    <circle cx="9" cy="12" r="8"/>
    <circle cx="-9" cy="12" r="8"/>
    <circle cx="-14" cy="-5" r="8"/>
    <circle cx="0" cy="0" r="4.5" fill="#E5BD68"/>
  </g>

  <!-- Corner watermark badge -->
  <g transform="translate(60, 60)">
    <circle cx="0" cy="0" r="28" fill="#EFE6D5" stroke="#263E2E" stroke-width="1.5" opacity="0.92"/>
    <text x="0" y="-3" font-family="'Cormorant Garamond', Georgia, serif" font-size="12" font-weight="700" fill="#263E2E" text-anchor="middle">OB</text>
    <text x="0" y="9" font-family="'Cormorant Garamond', Georgia, serif" font-size="6" font-weight="700" fill="#263E2E" text-anchor="middle" letter-spacing="0.5">ORGANIC BLOOM</text>
  </g>
</svg>
